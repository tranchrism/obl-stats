name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Run a full historical rebuild instead of the incremental current-season refresh."
        required: false
        default: "false"
  schedule:
    # GitHub cron is UTC-only and can start late; run twice daily about 12 hours apart.
    - cron: "0 9,21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore export cache
        uses: actions/cache@v4
        with:
          path: .export-cache
          key: export-cache-${{ github.run_id }}
          restore-keys: |
            export-cache-

      - name: Export static site
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full_rebuild }}" == "true" ]]; then
            python export_static.py --out dist --skip-playoffs --include-game-centers --cache-dir .export-cache --game-center-limit 25
          else
            python export_static.py --out dist --incremental-current --skip-playoffs --include-game-centers --cache-dir .export-cache --game-center-limit 0
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Set up Node for Cloudflare
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler@latest deploy

      - name: Skip Cloudflare deploy
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "Cloudflare deploy skipped. Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets to enable it."
